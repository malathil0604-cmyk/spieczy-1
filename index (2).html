<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spicezy – Live Store</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#f4efe9;--card:#fff;--ink:#1f1612;--mu:#6b5d55;--ln:#e2d8cf;--hd:#2b1810;--sub:#4a2a18;--ac:#e0935f;--btn:#e8a46c;--red:#b4441a;--ok:#067d62;--sh:0 1px 3px #0001,0 6px 18px #0000000d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1417;--card:#1b2227;--ink:#f1f3f3;--mu:#a6b0b4;--ln:#344048;--red:#ff8a50;--ok:#3ecf9f;--sh:0 1px 3px #0005}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1417;--card:#1b2227;--ink:#f1f3f3;--mu:#a6b0b4;--ln:#344048;--red:#ff8a50;--ok:#3ecf9f;--sh:0 1px 3px #0005}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{background:var(--hd);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;white-space:nowrap;cursor:pointer}.logo b{color:var(--ac)}
.search{flex:1;display:flex;min-width:140px}.search input{flex:1;min-width:0;border:0;border-radius:8px 0 0 8px;padding:9px 12px;background:#fff;color:#0f1111;margin:0}
.search span{background:var(--ac);color:#111;border-radius:0 8px 8px 0;padding:9px 12px}
.hb{background:none;border:0;color:#fff;cursor:pointer;padding:6px 8px;border-radius:6px;white-space:nowrap}.hb:hover{outline:1px solid #fff}
#cc{background:var(--ac);color:#111;border-radius:99px;padding:0 7px;font-weight:700;margin-left:2px}
.sub{background:var(--sub);color:#fff;display:flex;gap:6px;padding:6px 12px;overflow-x:auto;scrollbar-width:thin}
.sub button{background:none;border:0;color:#fff;cursor:pointer;padding:5px 10px;border-radius:6px;white-space:nowrap}.sub button.on,.sub button:hover{outline:1px solid #fff}
main{max-width:1200px;margin:auto;padding:12px}
.hero{background:linear-gradient(120deg,#2b1810,#c8743f);color:#fff;border-radius:14px;padding:26px;margin-bottom:14px}.hero h1{margin:0 0 4px;font-size:28px}
.chip{display:inline-block;background:#fff3;border-radius:99px;padding:3px 10px;margin:8px 6px 0 0;font-size:13px}
h2.sec{font-size:19px;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:5px;position:relative;box-shadow:var(--sh);transition:transform .15s}.card:hover{transform:translateY(-2px)}
.pic{height:150px;border-radius:10px;display:grid;place-items:center;font-size:64px;overflow:hidden;text-decoration:none;position:relative}.pic img{width:100%;height:100%;object-fit:contain}
.card h3{margin:2px 0;font-size:15px;line-height:1.25}.card h3 a{text-decoration:none}.card h3 a:hover{text-decoration:underline}
.pr{font-size:20px;font-weight:700}.mu{color:var(--mu);font-size:13px}.st{color:#f5a623;font-size:13px}.ok{color:var(--ok)}.bad{color:var(--red)}
.badge{position:absolute;top:8px;left:8px;background:#c8743f;color:#fff;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;z-index:1}
.heart{position:absolute;top:8px;right:8px;z-index:2;background:var(--card);border:1px solid var(--ln);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:17px;line-height:1}
.btn{background:var(--btn);border:1px solid #c98550;color:#111;border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:600}.btn:hover{filter:brightness(.96)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn2{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;cursor:pointer}.btn2:hover{border-color:var(--ac)}
.btn3{background:#c8743f;border:1px solid #a85f30;color:#fff;border-radius:99px;padding:9px 14px;cursor:pointer;font-weight:600;width:100%}.btn3:disabled{opacity:.5}
.shade{position:fixed;inset:0;background:#0008;z-index:30;display:none}.shade.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);z-index:31;transform:translateX(105%);transition:.2s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--ln)}.db{flex:1;overflow:auto;padding:12px 14px}.df{padding:12px 14px;border-top:1px solid var(--ln)}
.ci{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.ci .pic{height:54px;font-size:30px}
.qty{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:99px;padding:2px 8px}.qty button{background:none;border:0;cursor:pointer;font-size:17px;padding:0 4px}
.row{display:flex;justify-content:space-between;gap:8px;margin:4px 0}
input,select,textarea{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%;margin:4px 0}
input[type=checkbox],input[type=radio]{width:auto;margin:0 6px 0 0}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}.stats div{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}.stats b{display:block;font-size:21px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-top:1px solid var(--ln);vertical-align:top}th{border:0;color:var(--mu);white-space:nowrap}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.wide{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;max-width:90vw}
.trk{display:flex;gap:4px;margin:6px 0}.trk span{flex:1;font-size:10px;text-align:center;padding:4px 2px;border-radius:6px;background:var(--bg);color:var(--mu)}.trk span.on{background:var(--ok);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;background:#c8743f;color:#fff;border:0;border-radius:99px;padding:12px 18px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px #0006}.fab span{background:#fff;color:#4a2a18;border-radius:99px;padding:0 7px;margin-left:4px}
.menu{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);background:var(--card);z-index:41;transform:translateX(-105%);transition:.2s;display:flex;flex-direction:column;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.menu.on{transform:none}#mshade{z-index:40}
.menu button{background:none;border:0;border-bottom:1px solid var(--ln);text-align:left;padding:14px 16px;cursor:pointer}.menu button:hover{background:var(--bg)}
.mh{display:flex;gap:10px;align-items:center;padding:14px 16px;background:var(--hd);color:#fff}.mh>div{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.mh .mu{color:#ddd}.menu .mh button{border:0;color:#fff;padding:6px 10px;width:auto}
.av{width:38px;height:38px;border-radius:50%;background:var(--ac);color:#2b1810;display:grid;place-items:center;font-weight:800;flex:none}.msub button{padding-left:34px;font-size:14px}
body[data-gate] #fab,body[data-gate] #cartBtn,body[data-gate] #menuBtn,body[data-gate] .search,body[data-gate] #sub{display:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.bar select,.bar input{width:auto;margin:0}.bar label{display:flex;align-items:center;font-size:14px}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px}@media(max-width:720px){.pd{grid-template-columns:1fr}.hero h1{font-size:22px}.pic{height:130px}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.card{padding:9px}.pr{font-size:17px}}
.pd .big{height:340px;font-size:130px}.thumbs{display:flex;gap:8px;margin-top:8px}.thumbs button{width:58px;height:58px;border:2px solid var(--ln);border-radius:8px;background:var(--card);cursor:pointer;padding:0;overflow:hidden;font-size:26px}.thumbs button.on{border-color:var(--ac)}.thumbs img{width:100%;height:100%;object-fit:contain}
.vp{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.vp button{border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer}.vp button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset;font-weight:700}.vp button:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.hs .card{min-width:190px;max-width:190px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--bg)}.pill.ok{background:var(--ok);color:#fff}.pill.bad{background:var(--red);color:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.alert{border-left:4px solid var(--red);background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.bar2{height:8px;background:var(--ac);border-radius:4px;min-width:2px}
#inv{position:fixed;inset:0;background:var(--bg);z-index:70;overflow:auto;display:none;padding:12px}#inv.on{display:block}.invp{max-width:760px;margin:auto;background:#fff;color:#111;border:1px solid #ccc;border-radius:8px;padding:24px}.invp table{color:#111}.invp th{color:#555}.invp td,.invp th{border-top:1px solid #ddd}
@media print{body>*:not(#inv){display:none!important}#inv{position:static;display:block!important;padding:0}.noprint{display:none!important}.invp{border:0;padding:0}}
</style>
</head>

  if (d.cord) { oq = d.cord; tab = "orders"; paint(); }
  if (d.stksave) saveStock(d.stksave, +$('[data-stkin="' + d.stksave + '"]').value);
  if (d.stkadd) saveStock(d.stkadd, (S[d.stkadd] || 0) + 10);
  if (d.saveset !== undefined) saveSettings();
  if (d.seed !== undefined) seedCatalog();
});
document.addEventListener("change", async e => {
  const t = e.target, i = t.id;
  if (i === "th") { try { localStorage.setItem("szTheme", t.value); } catch (er) {} applyTheme(); }
  if (t.dataset.fbs) { try { await db.doc("feedback/" + t.dataset.fbs).update({status: t.value}); } catch (er) { toast("Could not update"); } }
  if (t.dataset.ost) { const o = O.find(x => x.id === t.dataset.ost); if (o) { try { await setStatus(o, t.value); toast("Order updated"); } catch (er) { toast(er.message || "Could not update"); } } }
  if (t.dataset.vsel) { sel[t.dataset.vsel] = t.value; repaint(); }
  if (i === "pi" && t.files.length) pend = await Promise.all([...t.files].slice(0, 3).map(shrink));
  if (i === "sortSel") { sortBy = t.value; repaint(); } if (i === "priceSel") { maxP = t.value; repaint(); } if (i === "stockChk") { inStock = t.checked; repaint(); } if (i === "rateChk") { topRated = t.checked; repaint(); }
  if (i === "rangeSel") { range = t.value; repaint(); } if (i === "ostSel") { ost = t.value; $("#tbl").innerHTML = ordersTbl(); } if (i === "ilowChk") { ilow = t.checked; $("#tbl").innerHTML = invTbl(); }
  if (i === "cz" || i === "cn" || i === "cp") { keepForm(); if (i === "cz") paintDrawer(); }
});
document.addEventListener("input", e => {
  const i = e.target.id, v = e.target.value;

  if (i === "mq") { mq = v; $("#olist").innerHTML = myList(); }

  if (i === "iqIn") { iq = v; $("#tbl").innerHTML = tab === "inv" ? invTbl() : prodTbl(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { open = false; paintDrawer(); menuOpen(false); $("#inv").classList.remove("on"); } });
document.addEventListener("focusout", () => { if (dirty) setTimeout(() => { if (!typing()) paint(); }, 400); });

/* ---------- Database layers: server (REST), plain browser file ---------- */
const api = async (m, u, b) => { const r = await fetch(u, {method: m, credentials: "same-origin", headers: {"Content-Type": "application/json", "X-Requested-With": "spicezy"}, body: b === undefined ? undefined : JSON.stringify(b)}); const j = await r.json().catch(() => ({})); if (!r.ok) { const e = new Error(j.error || "Request failed (" + r.status + ")"); e.status = r.status; throw e; } return j; };
function apiDb() {
  const pulls = []; window.szKick = () => pulls.forEach(f => f());
  const w = (m, u, d) => api(m, u, d).then(r => { setTimeout(window.szKick, 0); return r; });
  const qs = q => (q.flt ? "&f=" + encodeURIComponent(q.flt[0]) + "&v=" + encodeURIComponent(q.flt[1]) : "") + (q.ord ? "&sort=" + q.ord[0] + "&dir=" + q.ord[1] : "");
  const mk = c => ({ flt: null, ord: null, orderBy(f, d) { this.ord = [f, d]; return this; }, where(f, o, v) { this.flt = [f, v]; return this; },
    async get() { const rows = await api("GET", "/api/c/" + c + "?x=1" + qs(this)); return {docs: rows.map(r => ({id: r.id, data: () => r.data}))}; },
    onSnapshot(fn, errfn) { let last = "", lastErr = ""; const pull = async () => { try { const rows = await api("GET", "/api/c/" + c + "?x=1" + qs(this)), sig = JSON.stringify(rows); lastErr = ""; if (sig !== last) { last = sig; fn({docs: rows.map(r => ({id: r.id, data: () => r.data}))}); } } catch (e) { if (e.status === 401) return location.reload(); if (errfn && e.message !== lastErr) { lastErr = e.message; errfn(e); } } }; pulls.push(pull); pull(); setInterval(() => { if (!document.hidden) pull(); }, 3000); } });
  return { collection: mk, doc: path => { const [c, id] = path.split("/"), u = "/api/c/" + c + "/" + encodeURIComponent(id); return { get: async () => { try { const d = await api("GET", u); return {exists: true, data: () => d}; } catch (e) { if (e.status === 404) return {exists: false, data: () => null}; throw e; } }, set: d => w("PUT", u, d), update: d => w("PATCH", u, d), delete: () => w("DELETE", u) }; } };
}
function localDb() {
  let st = null; try { st = JSON.parse(localStorage.getItem("szdb")); } catch (e) {}
  if (!st || !st.products) {
    st = {products: {}, stock: {}, orders: {}}; const base = Date.now() - 1e6;
    SZ_CATALOG.forEach(p => { const d = {name: p.name, cat: p.cat, price: p.price, emoji: p.emoji, desc: p.desc, ing: p.ing || "", tags: p.tags || [], img: "", gallery: [], ts: base + p.ord}; if (p.variants) d.variants = p.variants; if (p.rating) d.rating = p.rating; st.products[p.id] = d; Object.entries(p.n).forEach(([vid, n]) => { st.stock[SKU(p.id, vid)] = {n}; }); });
  }
  ["feedback", "coupons", "couponUse", "reviews", "ratings", "sold", "wish", "settings"].forEach(c => { st[c] = st[c] || {}; });
  if (!st.cseed) { st.cseed = 1; st.coupons.WELCOME10 = {code: "WELCOME10", type: "percent", value: 10, min: 0, start: 0, exp: 0, limit: 0, active: true, show: true}; st.coupons.FLAT50 = {code: "FLAT50", type: "flat", value: 50, min: 299, start: 0, exp: 0, limit: 0, active: true, show: true}; }
  const subs = [], save = () => { try { localStorage.setItem("szdb", JSON.stringify(st)); } catch (e) { toast("Browser storage is full. Remove large photos."); } subs.forEach(f => f()); };
  const rows = (c, q) => { let r = Object.entries(st[c] = st[c] || {}).map(([id, d]) => ({id, data: () => d})); if (q.flt) r = r.filter(x => x.data()[q.flt[0]] === q.flt[1]); if (q.ord) r.sort((a, b) => (b.data()[q.ord[0]] - a.data()[q.ord[0]]) * (q.ord[1] === "desc" ? 1 : -1)); return {docs: r}; };
  return {
    doc: path => { const [c, id] = path.split("/"); st[c] = st[c] || {}; return {
      get: async () => ({exists: !!st[c][id], data: () => st[c][id]}),
      set: async d => { st[c][id] = d; save(); }, update: async d => { st[c][id] = Object.assign(st[c][id] || {}, d); save(); }, delete: async () => { delete st[c][id]; save(); } }; },
    collection: c => ({ ord: null, flt: null, orderBy(f, d) { this.ord = [f, d]; return this; }, where(f, o, v) { this.flt = [f, v]; return this; },
      async get() { return rows(c, this); }, onSnapshot(fn) { const fire = () => fn(rows(c, this)); subs.push(fire); setTimeout(fire, 0); } })
  };
}

/* ---------- Boot ---------- */
(async () => {
  paint(); paintDrawer(); setCount();
  let user = null;
  try { db = typeof claude !== "undefined" ? await claude.use("db") : null; user = db ? await claude.use("user") : null; } catch (e) { db = null; }
  if (!db) { try { const r = await fetch("/api/ping"); if (r.ok && ((await r.json()).app === "spicezy")) { srv = true; db = apiDb(); } } catch (e) {} }
  if (!db) { db = localDb(); local = true; }
  applyTheme();
  let canEdit = false;
  if (!local && !srv) { try { canEdit = !!(await user.me()).canEdit; } catch (e) {} }
  const acct = await gate(); me = {id: acct.id, name: acct.name, email: acct.email}; isAdmin = (local || srv) ? !!acct.admin : canEdit;
  uid = me.id; loadProfile(); loadRV(); delete document.body.dataset.gate;
  const err = e => toast("Live data problem: " + (e.message || e.code));
  try { const g = await db.doc("wish/" + uid).get(); W = g.exists ? (g.data().ids || []) : []; } catch (e) {}
  db.collection("products").onSnapshot(s => { P = {}; s.docs.forEach(d => { P[d.id] = d.data(); }); loaded.p = true; fixCart(); paint(); if (view === "pd") { if (!RV.includes(pid) && P[pid]) trackView(pid); } if (open && step === "cart" && !doneId) paintDrawer(); }, err);
  db.collection("stock").onSnapshot(s => { S = {}; s.docs.forEach(d => { S[d.id] = d.data().n; }); loaded.s = true; fixCart(); paint(); if (open && step === "cart" && !doneId) paintDrawer(); }, err);
  db.collection("settings").onSnapshot(s => { const m = s.docs.find(d => d.id === "main"); ST = m ? m.data() : {}; paint(); if (open && !doneId) paintDrawer(); }, err);
  db.collection("ratings").onSnapshot(s => { R = {}; s.docs.forEach(d => { R[d.id] = d.data(); }); paint(); }, err);
  db.collection("sold").onSnapshot(s => { SOLD = {}; s.docs.forEach(d => { SOLD[d.id] = d.data().n; }); paint(); }, err);
  if (uid && !isAdmin) db.collection("orders").where("uid", "==", uid).onSnapshot(s => { MY = s.docs.map(d => ({id: d.id, ...d.data()})); if (view === "orders") paint(); }, err);
  db.collection("coupons").where("show", "==", true).onSnapshot(s => { PUB = s.docs.map(d => d.data()); paint(); }, err);
  if (uid) (isAdmin ? db.collection("feedback").orderBy("ts", "desc") : db.collection("feedback").where("uid", "==", uid)).onSnapshot(s => { FB = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => b.ts - a.ts); paint(); }, err);
  if (isAdmin) {
    db.collection("coupons").onSnapshot(s => { C = {}; s.docs.forEach(d => { C[d.id] = d.data(); }); paint(); }, err);
    db.collection("couponUse").onSnapshot(s => { CU = {}; s.docs.forEach(d => { CU[d.id] = d.data().n; }); paint(); }, err);
    let first = true;
    db.collection("orders").orderBy("ts", "desc").onSnapshot(s => {
      const n = O.length; O = s.docs.map(d => ({id: d.id, ...d.data()}));
      if (!first && O.length > n) toast("🛒 New order received!"); first = false; paint();
    }, err);
  }
  route();
})();
